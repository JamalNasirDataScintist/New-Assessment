version: '3.8'

services:
  pdf-chatbot:
    build: .
    container_name: pdf-chatbot-app
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./vector_db:/app/vector_db
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - DEBUG=${DEBUG:-False}
      - HOST=0.0.0.0
      - PORT=5000
      - UPLOAD_FOLDER=uploads
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - TOP_K_CHUNKS=3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
